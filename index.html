<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#FFF200");
            star.setAttribute("material", "shader: flat; emissive: #FFFFFF; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });

      AFRAME.registerComponent("auto-scale-model", {
        schema: { targetSize: { type: "number", default: 1.0 } },
        init: function () {
          var el = this.el;
          var targetSize = this.data.targetSize;
          el.addEventListener("model-loaded", function () {
            var obj = el.getObject3D("mesh");
            if (!obj) return;
            var box = new THREE.Box3().setFromObject(obj);
            var size = new THREE.Vector3();
            box.getSize(size);
            var maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              var s = targetSize / maxDim;
              el.setAttribute("scale", s + " " + s + " " + s);
              console.log("[auto-scale-model] Loaded! Rescaled to: " + s);
            }
          });
          el.addEventListener("model-error", function (e) {
            console.error("[model-error]", e);
            var banner = document.getElementById("debug-banner");
            if (banner) {
              banner.style.display = "block";
              banner.innerHTML = "⚠️ <b>3D 모델 로드 실패</b><br>브라우저 보안(CORS)으로 인해 로컬 파일(file://)에서는 3D 모델이 차단됩니다.<br>로컬 웹 서버(예: <b>서버실행.bat</b>)를 통해 열어주세요.";
            }
          });
        },
      });

      window.addEventListener("DOMContentLoaded", function () {
        if (window.location.protocol === "file:") {
          var banner = document.getElementById("debug-banner");
          if (banner) {
            banner.style.display = "block";
            banner.innerHTML = "⚠️ <b>안내: 파일 직접 열림 (file://)</b><br>브라우저 보안 정책상 직접 더블클릭해서 열면 3D 모델(.glb)을 불러올 수 없습니다.<br>폴더 안의 <b>서버실행.bat</b>을 더블클릭하여 실행해 주세요.";
          }
        }
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: url("숲.jpg") no-repeat center center fixed;
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="debug-banner"
      style="display:none; position:fixed; top:16px; left:16px; z-index:99999; background:rgba(15, 23, 42, 0.92); color:#f87171; padding:14px 18px; border-radius:10px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:14px; border:1px solid #ef4444; max-width:420px; line-height:1.6; box-shadow:0 4px 20px rgba(0,0,0,0.5);"
    ></div>

    <a-scene>
      <a-assets>
        <img id="forest-bg" src="숲.jpg" />
        <a-asset-item id="butterfly-model" src="나비.glb"></a-asset-item>
        <a-asset-item id="mosquito-model" src="모기.glb"></a-asset-item>
        <a-asset-item id="squirrel-model" src="다람쥐.glb"></a-asset-item>
      </a-assets>

      <a-sky src="#forest-bg" rotation="0 -90 0"></a-sky>

      <a-entity starfield></a-entity>

      <a-entity light="type: ambient; color: #667085; intensity: 0.8"></a-entity>
      <a-entity
        light="type: point; color: #ffffff; intensity: 1.2; distance: 90"
        position="0 6 6"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera position="0 0 0"></a-camera>

        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5500; easing: linear;"
        >
          <a-entity
            gltf-model="모기.glb"
            auto-scale-model="targetSize: 1.68"
            position="3.8 0.2 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 2200; easing: linear;"
          ></a-entity>
        </a-entity>

        <a-entity
          rotation="14 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear;"
        >
          <a-entity
            gltf-model="나비.glb"
            auto-scale-model="targetSize: 3.3"
            position="8.0 0.5 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear;"
          ></a-entity>
        </a-entity>

        <a-entity
          rotation="-10 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 13500; easing: linear;"
        >
          <a-entity
            gltf-model="다람쥐.glb"
            auto-scale-model="targetSize: 4.5"
            position="14.0 0.1 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3800; easing: linear;"
            animation__bounce="property: position; from: 14.0 0.1 0; to: 14.0 2.5 0; dir: alternate; loop: true; dur: 750; easing: easeOutQuad;"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
